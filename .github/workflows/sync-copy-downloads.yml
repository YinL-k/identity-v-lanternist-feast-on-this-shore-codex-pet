name: Sync rewritten pet copy into download archives

on:
  push:
    branches:
      - codex/rewrite-identity-v-copy
    paths:
      - "pets/**"
      - ".github/workflows/sync-copy-downloads.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild download ZIPs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          pets = Path("pets")
          downloads = Path("downloads")
          downloads.mkdir(exist_ok=True)

          for folder in sorted(p for p in pets.iterdir() if p.is_dir()):
              target = downloads / f"{folder.name}.zip"
              with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for path in sorted(p for p in folder.rglob("*") if p.is_file()):
                      zf.write(path, path.as_posix())
          PY

      - name: Refresh SHA256SUMS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          lines = []
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if path.as_posix() == "SHA256SUMS.txt" or not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.as_posix()}")
          Path("SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit regenerated archives
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads SHA256SUMS.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "同步重写文案到下载包"
          git push
